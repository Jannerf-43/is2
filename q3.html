<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>질문 3 - 용기가 곧 배려다!</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .comment-panel {
        max-width: 680px;
        width: 100%;
        margin: auto;
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 5px 5px 0px var(--ink);
      }
      textarea {
        width: 100%;
        height: 90px;
        margin-top: 10px;
        padding: 12px;
        border: 2.5px solid var(--ink);
        border-radius: 10px;
        font-size: 0.92rem;
        font-weight: 600;
        resize: none;
      }
      .finish-btn {
        width: 100%;
        margin-top: 12px;
        padding: 15px;
        background: var(--yellow-point);
        color: var(--ink);
        border: 3px solid var(--ink);
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 4px 4px 0px var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="toon-page">
      <header class="narration-bar">
        <div class="header-top">
          <span class="step-tag" id="stepTag">질문 3 / 3</span>
          <div class="gauge-wrap">
            <div class="gauge-track">
              <div class="gauge-fill" id="gaugeFill" style="width: 80%"></div>
            </div>
            <span class="gauge-text" id="gaugeText">80%</span>
          </div>
          <button
            class="rewind-btn"
            id="backBtn"
            style="display: none"
            onclick="resetQ3()"
          >
            ◀ 이전
          </button>
        </div>
        <h1 class="speech-question" id="qText">
          먼저 나서서 발표하거나 인사하는 사람들을 보면 어떤 생각이 드시나요?
        </h1>
        <p class="speech-guide" id="qGuide">
          평소 느끼는 솔직한 생각을 선택해 주세요.
        </p>
      </header>

      <main class="cut-stage">
        <div class="scene-anim" id="sceneInitial">
          <div class="cut-grid cuts-2">
            <div class="toon-cut" onclick="pickInitialQ3(this, 'positive')">
              <img
                src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80"
                alt="긍정적인 시선"
              />
              <div class="sfx-stamp">긍정적 😊</div>
              <div class="cut-dialogue">
                긍정적이에요 — 고맙거나 자연스럽고 보기 좋다고 생각해요
              </div>
            </div>

            <div class="toon-cut" onclick="pickInitialQ3(this, 'negative')">
              <img
                src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=900&q=80"
                alt="부담스러운 시선"
              />
              <div class="sfx-stamp">어색함 😅</div>
              <div class="cut-dialogue">
                솔직히 조금 어색하거나 부담스럽게 느껴져요
              </div>
            </div>
          </div>
        </div>

        <div class="scene-anim" id="scenePosReasons" style="display: none">
          <div class="cut-grid cuts-4" id="posCutGrid"></div>
        </div>

        <div class="scene-anim" id="sceneFinal" style="display: none">
          <div class="comment-panel">
            <h2 style="font-size: 1.15rem; font-weight: 900">
              💌 [선택] 따뜻한 한마디를 남겨주세요
            </h2>
            <p
              style="
                font-size: 0.86rem;
                color: #475569;
                margin-top: 6px;
                font-weight: 600;
              "
            >
              용기 내어 발표하거나 인사하는 학우, 혹은 교수님·기사님께 전하고
              싶은 말이 있다면 자유롭게 적어주세요. (발표 자료에 익명으로
              소개됩니다)
            </p>
            <textarea
              id="q3Comment"
              placeholder="작성하지 않고 바로 아래 결과 보기 버튼을 누르셔도 됩니다."
            ></textarea>
            <button
              class="finish-btn"
              id="submitBtn"
              onclick="submitAndGoResult()"
            >
              설문 결과 및 통계 확인하기 →
            </button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycbzf3IMvBPYKZ7VLX__5fBIijJ40fq38uoStBGErirW7-2QWHlMfZREZBoKVsTLGvXDz/exec'
      const FIVE_MIN_MS = 5 * 60 * 1000

      // [핵심 1] 학우가 3번 질문을 읽는 동안 백그라운드에서 5분 캐시 통계를 미리 받아옴
      ;(function prefetchStats() {
        if (
          SCRIPT_URL ===
          'https://script.google.com/macros/s/AKfycbzf3IMvBPYKZ7VLX__5fBIijJ40fq38uoStBGErirW7-2QWHlMfZREZBoKVsTLGvXDz/exec'
        )
          return
        const cachedTime = Number(localStorage.getItem('stats_cache_time') || 0)

        // 저장된 지 5분이 넘었거나 데이터가 없으면 백그라운드에서 미리 가져오기
        if (
          Date.now() - cachedTime > FIVE_MIN_MS ||
          !localStorage.getItem('stats_cache_data')
        ) {
          fetch(SCRIPT_URL)
            .then((res) => res.json())
            .then((stats) => {
              localStorage.setItem('stats_cache_data', JSON.stringify(stats))
              localStorage.setItem('stats_cache_time', String(Date.now()))
            })
            .catch((err) => console.warn('백그라운드 통계 프리패치 실패:', err))
        }
      })()

      const posCuts = [
        {
          text: '어색한 정적을 깨고 분위기를 살려줘서 오히려 고맙다',
          sfx: '고마움 👏',
          img: 'images/q3_p1.webp',
        },
        {
          text: '답이 조금 틀리더라도 용기 내어 참여하는 모습이 멋지다',
          sfx: '응원 ✨',
          img: 'images/q3_p2.webp',
        },
        {
          text: '밝게 인사하는 모습을 보면 나도 덩달아 기분이 좋아진다',
          sfx: '기분 좋음 🌱',
          img: 'images/q3_p3.webp',
        },
        {
          text: '전혀 이상하게 보지 않고 자연스러운 일상이라고 생각한다',
          sfx: '자연스러움 🙂',
          img: 'images/q3_p4.webp',
        },
      ]

      function setGauge(percent) {
        document.getElementById('gaugeFill').style.width = percent + '%'
        document.getElementById('gaugeText').innerText = percent + '%'
      }

      function pickInitialQ3(cutEl, type) {
        cutEl.classList.add('action-picked')
        sessionStorage.setItem('q3_type', type)

        setTimeout(() => {
          document.getElementById('sceneInitial').style.display = 'none'
          document.getElementById('backBtn').style.display = 'inline-block'

          if (type === 'negative') {
            sessionStorage.setItem(
              'q3_choice',
              '조금 어색하거나 부담스럽게 느껴진다',
            )
            openFinalScene()
          } else {
            setGauge(90)
            document.getElementById('scenePosReasons').style.display = 'flex'
            document.getElementById('stepTag').innerText = '질문 3-1 / 3'
            document.getElementById('qText').innerText =
              '그중 어떤 생각이 가장 크게 드시나요?'
            document.getElementById('qGuide').innerText =
              '가장 공감되는 생각 하나를 선택해 주세요.'

            const grid = document.getElementById('posCutGrid')
            grid.innerHTML = ''
            posCuts.forEach((item) => {
              const div = document.createElement('div')
              div.className = 'toon-cut'
              div.innerHTML = `
            <img src="${item.img}" alt="${item.text}">
            <div class="sfx-stamp">${item.sfx}</div>
            <div class="cut-dialogue">${item.text}</div>
          `
              div.onclick = () => {
                div.classList.add('action-picked')
                sessionStorage.setItem('q3_choice', item.text)
                setTimeout(openFinalScene, 240)
              }
              grid.appendChild(div)
            })
          }
        }, 240)
      }

      function openFinalScene() {
        setGauge(98)
        document.getElementById('scenePosReasons').style.display = 'none'
        document.getElementById('sceneFinal').style.display = 'flex'
        document.getElementById('stepTag').innerText = '설문 완료'
        document.getElementById('qText').innerText =
          '모든 질문에 응답해 주셨습니다!'
        document.getElementById('qGuide').innerText =
          '아래 버튼을 누르면 기다림 없이 즉시 결과가 공개됩니다.'
      }

      function resetQ3() {
        setGauge(80)
        document
          .querySelectorAll('.toon-cut')
          .forEach((el) => el.classList.remove('action-picked'))
        document.getElementById('scenePosReasons').style.display = 'none'
        document.getElementById('sceneFinal').style.display = 'none'
        document.getElementById('sceneInitial').style.display = 'flex'
        document.getElementById('backBtn').style.display = 'none'
        document.getElementById('stepTag').innerText = '질문 3 / 3'
        document.getElementById('qText').innerText =
          '먼저 나서서 발표하거나 인사하는 사람들을 보면 어떤 생각이 드시나요?'
        document.getElementById('qGuide').innerText =
          '평소 느끼는 솔직한 생각을 선택해 주세요.'
      }

      // [핵심 2] 제출 클릭 시 기다리지 않고(No await) 백그라운드 전송 후 0.1초 만에 즉시 페이지 이동!
      function submitAndGoResult() {
        setGauge(100)
        const btn = document.getElementById('submitBtn')
        btn.disabled = true
        sessionStorage.setItem(
          'q3_comment',
          document.getElementById('q3Comment').value,
        )
        sessionStorage.setItem('just_submitted', 'true') // 내 응답 +1 즉시 반영용 플래그

        const payload = {
          q1: sessionStorage.getItem('q1') || 'Yes',
          q1_reason:
            sessionStorage.getItem('q1_reason') ||
            '다른 사람들의 시선이 신경 쓰여서',
          q2: sessionStorage.getItem('q2') || 'Yes',
          q2_reason: sessionStorage.getItem('q2_reason') || '어색해서',
          q3_choice:
            sessionStorage.getItem('q3_choice') ||
            '어색한 정적을 깨고 분위기를 살려줘서 오히려 고맙다',
          q3_type: sessionStorage.getItem('q3_type') || 'positive',
          q3_comment: sessionStorage.getItem('q3_comment') || '',
        }

        if (SCRIPT_URL !== '여기에_웹앱_URL을_넣으세요') {
          // keepalive: true 옵션으로 페이지가 넘어가도 브라우저가 끝까지 시트에 데이터를 저장함
          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            keepalive: true,
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
          }).catch((e) => console.warn(e))
        }

        // 서버 응답을 기다리지 않고 즉시 결과 창으로 전환!
        document.body.classList.add('page-exit')
        setTimeout(() => {
          window.location.href = 'result.html'
        }, 150)
      }
    </script>
  </body>
</html>
