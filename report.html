<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠페인 실시간 결과 리포트 - 용기가 곧 배려다!</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        overflow-y: auto;
        height: auto;
        min-height: 100dvh;
        background: var(--paper);
      }
      .report-container {
        max-width: 700px;
        margin: 0 auto;
        padding: 20px 16px 40px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .report-header {
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 4px 4px 0px var(--ink);
        text-align: center;
      }
      .report-header h1 {
        font-size: clamp(1.2rem, 2vw, 1.5rem);
        font-weight: 900;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .report-header p {
        font-size: 0.88rem;
        font-weight: 700;
        color: #475569;
      }
      .stat-board {
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 4px 4px 0px var(--ink);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .big-stat-num {
        font-size: clamp(2rem, 3vw, 2.5rem);
        font-weight: 900;
        color: var(--blue-accent);
        margin: 4px 0;
      }
      .bar-row {
        margin-top: 10px;
        font-size: 0.84rem;
        font-weight: 700;
      }
      .bar-track {
        height: 12px;
        background: #e2e8f0;
        border: 2px solid var(--ink);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        height: 100%;
        background: var(--blue-accent);
      }
      .speech-bubble-box {
        background: #ffffff;
        border: 2px solid var(--ink);
        border-radius: 10px;
        padding: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.45;
        box-shadow: 2px 2px 0px var(--ink);
      }
      /* 설문 참여 유도 CTA 버튼 스타일 */
      .cta-box {
        background: #eff6ff;
        border: 3px solid var(--ink);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 4px 4px 0px var(--ink);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cta-btn {
        display: inline-block;
        background: var(--blue-accent);
        color: #ffffff;
        padding: 14px 20px;
        border: 3px solid var(--ink);
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 3px 3px 0px var(--ink);
        transition: transform 0.1s ease;
      }
      .cta-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="report-container">
      <!-- 상단 타이틀 섹션 -->
      <header class="report-header">
        <span class="step-tag">📈 이로운 2조 캠페인 공식 리포트</span>
        <h1>“용기가 곧 배려다!” 실시간 결과 대시보드</h1>
        <p>현재까지 학우분들이 참여해주신 소중한 설문 통계 결과입니다.</p>
      </header>

      <!-- 통계 본문 보드 -->
      <main class="stat-board" id="reportStatBoard">
        <div style="text-align: center; padding: 20px; font-weight: 800">
          실시간 통계 데이터를 불러오는 중입니다... ⏳
        </div>
      </main>

      <!-- 하단 설문 참여 유도 섹션 -->
      <section class="cta-box">
        <div style="font-weight: 900; font-size: 1rem; color: var(--ink)">
          ✨ 나도 캠페인에 목소리를 보태고 싶다면?
        </div>
        <p style="font-size: 0.85rem; font-weight: 700; color: #475569">
          간단한 설문에 참여하고 나만의 맞춤 응원 메시지와 리포트를 확인해
          보세요!
        </p>
        <div>
          <a href="index.html" class="cta-btn">
            ✍️ 설문조사 참여하러 가기 &rarr;
          </a>
        </div>
      </section>
    </div>

    <script>
      const SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycbzf3IMvBPYKZ7VLX__5fBIijJ40fq38uoStBGErirW7-2QWHlMfZREZBoKVsTLGvXDz/exec'

      // 서버 연결 실패 시 보여줄 기본 Fallback 데이터
      const fallbackStats = {
        total: 42,
        positiveRate: 95,
        counts: {
          '어색한 정적을 깨고 분위기를 살려줘서 오히려 고맙다': 18,
          '답이 조금 틀리더라도 용기 내어 참여하는 모습이 멋지다': 11,
          '밝게 인사하는 모습을 보면 나도 덩달아 기분이 좋아진다': 8,
          '전혀 이상하게 보지 않고 자연스러운 일상이라고 생각한다': 3,
          '조금 어색하거나 부담스럽게 느껴진다': 2,
        },
        recentComments: [
          '작은 용기가 강의실과 셔틀버스를 따뜻하게 만듭니다. 내일 우리 함께 먼저 인사해요!',
        ],
      }

      function renderReportDashboard(stats) {
        let barsHtml = ''
        Object.entries(stats.counts || fallbackStats.counts).forEach(
          ([label, count]) => {
            const total = stats.total || 42
            const pct = total > 0 ? Math.round((count / total) * 100) : 0
            barsHtml += `
            <div class="bar-row">
              <div style="display:flex; justify-content:space-between;">
                <span>${label}</span><span>${pct}% (${count}명)</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>
          `
          },
        )

        const latestComment =
          stats.recentComments && stats.recentComments.length > 0
            ? stats.recentComments[0]
            : '작은 용기가 강의실과 셔틀버스를 따뜻하게 만듭니다!'

        document.getElementById('reportStatBoard').innerHTML = `
          <div>
            <span class="step-tag">📊 3번 질문 실시간 통계 (총 ${stats.total || 42}명 참여)</span>
            <div class="big-stat-num">${stats.positiveRate || 95}%가 긍정 응답!</div>
            <p style="font-size:0.88rem; font-weight:700; color:#334155; margin-bottom:8px;">
              타인이 나설 때 학우들의 <strong>${stats.positiveRate || 95}%가 고마움과 호감</strong>을 느꼈습니다.
            </p>
            ${barsHtml}
          </div>

          <div style="margin-top: 14px; padding-top: 12px; border-top: 2px dashed var(--ink);">
            <div style="font-weight:900; font-size:0.9rem; margin-bottom:6px;">💬 참여 학우의 따뜻한 한마디</div>
            <div class="speech-bubble-box" style="background:#fffbeb;">"${latestComment}"</div>
          </div>
        `
      }

      // 페이지 진입 시 5분 캐시가 적용된 최신 서버 통계를 즉시 가져옴
      fetch(SCRIPT_URL)
        .then((res) => res.json())
        .then((liveStats) => {
          renderReportDashboard(liveStats)
        })
        .catch((err) => {
          console.warn('서버 통계 로드 실패, 기본 데이터로 대체합니다.', err)
          const rawCache = localStorage.getItem('stats_cache_data')
          renderReportDashboard(rawCache ? JSON.parse(rawCache) : fallbackStats)
        })
    </script>
  </body>
</html>
